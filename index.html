<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex Komendir AirCraft — AK-Arany Sas Alpha</title>
<style>
:root{--green:#0f261e;--gold:#c6a951;--bg:#0a1a14;--text:#e6e8d9}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
header{background:var(--green);border-bottom:3px solid var(--gold);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{color:var(--gold);font-weight:900;letter-spacing:2px;font-size:14px}
select.lang{background:var(--gold);color:var(--green);border:none;padding:8px 12px;font-weight:bold;cursor:pointer;border-radius:4px}
.hero img{width:100%;display:block;filter:contrast(1.05)}
.content{padding:36px 20px;max-width:900px;margin:auto}
h1{color:var(--gold);letter-spacing:3px;margin-bottom:5px}
h2{color:var(--gold);margin-top:32px;border-left:4px solid var(--gold);padding-left:12px}
.tag{opacity:.7;font-style:italic;margin-bottom:24px}
.hidden{display:none}
footer{text-align:center;padding:30px;opacity:.6;font-size:13px;border-top:1px solid #1e3a2f;margin-top:40px}
ul{padding-left:20px}
</style>
</head>
<body>
<header>
<div class="logo">LEX KOMENDIR AIRCRAFT</div>
<select class="lang" id="langSelect" onchange="setLang(this.value)">
<option value="pt">🇧🇷 Português</option>
<option value="en">🇺🇸 English</option>
<option value="es">🇪🇸 Español</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="fr">🇫🇷 Français</option>
<option value="hu">🇭🇺 Magyar</option>
</select>
</header>
<div class="hero">
<img src="capa_pista_lexkomendir.webp.png" alt="AK-Arany Sas Alpha">
</div>
<div class="content">

<div class="lang-block" data-lang="pt">
<h1>AK-ARANY SAS ALPHA</h1>
